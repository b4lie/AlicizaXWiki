# AlicizaX 文档站配置
# 本地预览：.venv\Scripts\python -m mkdocs serve
# 本地构建：.venv\Scripts\python -m mkdocs build --strict

site_name: AlicizaX
site_url: https://b4lie.github.io/AlicizaXWiki/
site_description: AlicizaX —— 面向商业化项目的 Unity 游戏框架文档
site_author: AlicizaX
copyright: Copyright &copy; AlicizaX

repo_url: https://github.com/b4lie/AlicizaXWiki
repo_name: b4lie/AlicizaXWiki
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/mark.png
  favicon: assets/favicon.png
  # 关闭 Google Fonts（国内加载不稳定），改用 extra.css 里的系统字体栈
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      # 中文按 jieba 分词；分隔符保留中英文混排的边界
      lang:
        - zh
        - en
      separator: '[\s\u200b\-]'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/b4lie/AlicizaXWiki
      name: 文档仓库
    - icon: fontawesome/brands/github
      link: https://github.com/AlicizaX/AlicizaXTemplate
      name: 框架仓库

extra_css:
  - assets/extra.css

nav:
  - 开始:
      - 首页: index.md
      - 概览: overview.md
      - 快速入门: quickstart.md
  - 核心服务:
      - Service 基础服务: modules/service/index.md
      - Timer 计时器: modules/timer/index.md
      - Event 事件: modules/event/index.md
      - Procedure 流程: modules/procedure/index.md
  - 资源与对象:
      - Resources 资源: modules/resource/index.md
      - Scene 场景: modules/scene/index.md
      - GameObjectPool 实例池: modules/gameobjectpool/index.md
      - MemoryPool 内存池: modules/memorypool/index.md
  - UI 与表现:
      - UI 界面: modules/ui/index.md
      - Audio 音频: modules/audio/index.md
      - Localization 本地化: modules/localization/index.md

