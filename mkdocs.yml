# AlicizaX 文档站配置
# 本地预览：.venv\Scripts\python -m mkdocs serve
# 本地构建：.venv\Scripts\python -m mkdocs build --strict

site_name: AlicizaX
site_url: https://b4lie.github.io/AlicizaXWiki/
site_description: AlicizaX —— 面向商业化项目的 Unity 游戏框架文档
site_author: AlicizaX
copyright: Copyright &copy; AlicizaX

repo_url: https://github.com/b4lie/AlicizaXWiki
repo_name: b4lie/AlicizaXWiki
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/mark.png
  favicon: assets/favicon.png
  # 关闭 Google Fonts（国内加载不稳定），改用 extra.css 里的系统字体栈
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      # 中文按 jieba 分词；分隔符保留中英文混排的边界
      lang:
        - zh
        - en
      separator: '[\s\u200b\-]'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/b4lie/AlicizaXWiki
      name: 文档仓库
    - icon: fontawesome/brands/github
      link: https://github.com/AlicizaX/AlicizaXTemplate
      name: 框架仓库

extra_css:
  - assets/extra.css

nav:
  - 快速开始: quickstart.md
  - Service 服务容器: modules/service/index.md
  - Timer 计时器: modules/timer/index.md
  - Event 事件: modules/event/index.md
  - Procedure 流程: modules/procedure/index.md
  - Resources 资源:
      - 概览: modules/resource/index.md
      - 加载、租赁与绑定: modules/resource/loading.md
      - 资源包与更新: modules/resource/packages.md
      - 回收、统计与调试: modules/resource/reclaim.md
  - Scene 场景: modules/scene/index.md
  - GameObjectPool 实例池: modules/gameobjectpool/index.md
  - MemoryPool 内存池: modules/memorypool/index.md
  - UI 界面:
      - 概览: modules/ui/index.md
      - 窗口声明与生命周期: modules/ui/lifecycle.md
      - 打开、关闭与查询: modules/ui/window.md
      - 路由与转场: modules/ui/router.md
      - Widget 与 Tab: modules/ui/widget.md
      - 缓存与性能: modules/ui/performance.md
  - Audio 音频: modules/audio/index.md
  - Input 输入:
      - 概览: modules/input/index.md
      - 设备、读取与重绑定: modules/input/uxinput.md
      - 输入图标: modules/input/input-glyph.md
      - 快捷键: modules/input/hotkey-component.md
      - UI 导航: modules/input/navigation.md
      - 交互反馈: modules/input/input-feedback.md
      - 性能与分配: modules/input/performance.md
  - UI Extension 扩展组件:
      - 概览: modules/ui-extension/index.md
      - 基础控件:
          - UXSelectable: modules/ui-extension/uxselectable.md
          - UXButton: modules/ui-extension/uxbutton.md
          - UXToggle: modules/ui-extension/uxtoggle.md
          - UXGroup: modules/ui-extension/uxgroup.md
          - UXImage: modules/ui-extension/uximage.md
          - UXDraggable: modules/ui-extension/uxdraggable.md
      - RecyclerView 虚拟列表:
          - 概览: modules/ui-extension/recyclerview/index.md
          - 普通列表: modules/ui-extension/recyclerview/list.md
          - 多模板列表: modules/ui-extension/recyclerview/mixed.md
          - 循环列表: modules/ui-extension/recyclerview/loop.md
          - 分组列表: modules/ui-extension/recyclerview/group.md
          - 数据更新与交互: modules/ui-extension/recyclerview/interaction.md
          - 配置与 API: modules/ui-extension/recyclerview/config.md
          - 列表导航: modules/ui-extension/recyclerview/navigation.md
  - Localization 本地化:
      - 概览: modules/localization/index.md
      - 词库配置与生成: modules/localization/config.md
      - 运行时加载与切换: modules/localization/runtime.md
      - TMP 绑定与编辑器预览: modules/localization/tmp.md
  - Config 配置管线:
      - 概览: modules/config/index.md
      - 表结构与 Excel 约定: modules/config/tables.md
      - Luban 生成与脚本: modules/config/generate.md
      - 生成物与运行时衔接: modules/config/outputs.md
      - 常见错误排查: modules/config/troubleshooting.md
  - Debugger 调试器:
      - 介绍: modules/debugger/index.md
      - 启动、窗口树与日志: modules/debugger/usage.md
      - 命令控制台: modules/debugger/command.md
      - API 速查: modules/debugger/api.md
  - Editor Extension 编辑器扩展:
      - 概览与安装: modules/editor-extension/index.md
      - 图集工具: modules/editor-extension/atlas.md
      - Texture Packer: modules/editor-extension/texture-packer.md
      - 资产引用查找: modules/editor-extension/reference-finder.md
      - HybridCLR 构建工具: modules/editor-extension/hybridclr.md
  - Installer 安装器:
      - 安装入口与步骤: modules/installer/index.md
      - 项目模板与生成目录: modules/installer/templates.md
      - 升级、修复与卸载: modules/installer/maintain.md
      - 安装失败排查: modules/installer/troubleshooting.md

